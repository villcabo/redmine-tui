# Categories for the release notes GitHub generates from merged pull requests
# (GoReleaser asks for them through `changelog.use: github-native`).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
