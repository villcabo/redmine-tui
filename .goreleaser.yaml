# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: redmine-tui

before:
  hooks:
    - go mod verify

builds:
  - id: redmine-tui
    main: .
    binary: redmine-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - redmine-tui
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.es.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes list the merged pull requests with their authors, grouped by label as
# .github/release.yml says, instead of one line per commit.
changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
